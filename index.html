<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoHang Protocol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Unbounded:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0a0a0a; }
    .btn { cursor: pointer; border: none; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; transition: all 0.15s; }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const PHASES = {
      warmup:  { label: "Warm-Up",      color: "#4ade80" },
      tissue:  { label: "Tissue Prep",  color: "#facc15" },
      working: { label: "Working Sets", color: "#fb923c" },
      rest:    { label: "Rest",         color: "#60a5fa" },
      done:    { label: "Done",         color: "#e879f9" },
    };

    // Climbing-day protocol: done after a general warm-up, right before you climb.
    // 6 hard efforts total (down from 14) so there's plenty left for the wall.
    const PROTOCOL = [
      {
        id: 1,
        phase: "warmup",
        name: "Easy Pulls — Half Crimp",
        grip: "Half Crimp",
        holdLabel: "35mm",
        gripDesc: "Four fingers curled over the edge, middle joint bent ~90°. Thumb rests alongside index finger — don't wrap it over.",
        sets: 3,
        hangDuration: 7,
        restBetweenSets: 45,
        intensity: "30% → 50% effort",
        note: "Build a little each set. Just getting blood into the fingers — nothing should feel like work yet.",
      },
      {
        id: 2,
        phase: "tissue",
        name: "Full Crimp Exposure",
        grip: "Full Crimp",
        holdLabel: "20mm",
        gripDesc: "Fingers fully crimped — middle joint sharply bent, tip joint slightly hyperextended. Thumb OFF (no thumb lock). Ease into the load over 2–3 seconds, never yank.",
        sets: 3,
        hangDuration: 7,
        restBetweenSets: 45,
        intensity: "40–50% effort",
        note: "This is NOT strength training — it's teaching your pulleys to tolerate the position so a surprise crimp on the wall isn't their first time. Stays light forever. Any sharp or localized pain at the base of a finger: stop.",
      },
      {
        id: 3,
        phase: "working",
        name: "Strength — Half Crimp",
        grip: "Half Crimp",
        holdLabel: "20mm",
        gripDesc: "Four fingers on the 20mm edge, middle joint bent ~90°. Pull DOWN into the hold — don't lift off. Shoulder blades slightly engaged.",
        sets: 3,
        hangDuration: 10,
        restBetweenSets: 120,
        intensity: "80–85% effort",
        note: "Hard but controlled — you should feel like you could pull a bit harder. Ramp up over the first 2s, then hold steady. Save the last 15% for the wall.",
      },
      {
        id: 4,
        phase: "working",
        name: "Strength — Open Hand / Drag",
        grip: "Open Hand",
        holdLabel: "25mm",
        gripDesc: "Four fingers on the 25mm edge, kept STRAIGHTER than half crimp — gentle curl, minimal bend at the middle knuckle. No thumb. Every other session you can swap to a 3-finger drag (pinky off).",
        sets: 3,
        hangDuration: 10,
        restBetweenSets: 120,
        intensity: "80–85% effort",
        note: "Lowest pulley load of any grip, so this is where you can push the hardest safely. Then go climb — this was your warm-up.",
      },
    ];

    const READY_SECONDS = 10;     // time to get on the edge after pressing start
    const BETWEEN_EXERCISES = 90; // rest when switching grips
    const COUNTDOWN_BEEPS = 3;    // beeps in the last N seconds before a hang

    // Flatten the protocol into an ordered list of timed steps. Rest steps carry
    // the exIdx/set of the hang that follows them, so previews come for free.
    function buildSteps(protocol) {
      const steps = [{ type: "ready", exIdx: 0, set: 1, duration: READY_SECONDS }];
      protocol.forEach((ex, exIdx) => {
        for (let set = 1; set <= ex.sets; set++) {
          steps.push({ type: "hang", exIdx, set, duration: ex.hangDuration });
          const lastSet = set === ex.sets;
          if (lastSet && exIdx === protocol.length - 1) continue;
          steps.push(lastSet
            ? { type: "between", exIdx: exIdx + 1, set: 1, duration: BETWEEN_EXERCISES }
            : { type: "rest", exIdx, set: set + 1, duration: ex.restBetweenSets });
        }
      });
      return steps;
    }

    const STEPS = buildSteps(PROTOCOL);
    const TOTAL_SECONDS = STEPS.reduce((sum, s) => sum + s.duration, 0);

    const STEP_TEXT = {
      ready:   { tag: "GET READY",     title: "Get On The Edge" },
      rest:    { tag: "REST",          title: "Recover" },
      between: { tag: "NEXT EXERCISE", title: "Change Grip" },
    };

    function formatTime(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, "0")}`;
    }

    function Arc({ fraction, size = 160, stroke = 10, color }) {
      const r = (size - stroke) / 2;
      const circ = 2 * Math.PI * r;
      const f = Math.min(1, Math.max(0, fraction));
      return (
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1e1e1e" strokeWidth={stroke} />
          <circle
            cx={size/2} cy={size/2} r={r}
            fill="none" stroke={color} strokeWidth={stroke}
            strokeDasharray={circ}
            strokeDashoffset={circ * (1 - f)}
            strokeLinecap="round"
            style={{ transition: "stroke-dashoffset 0.12s linear" }}
          />
        </svg>
      );
    }

    // Audio cues via Web Audio. The context must be created/resumed from a tap,
    // otherwise iOS keeps it silent.
    function useCues() {
      const ctxRef = useRef(null);
      const [muted, setMuted] = useState(false);
      const mutedRef = useRef(false);
      mutedRef.current = muted;

      const unlock = useCallback(() => {
        try {
          if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          if (ctxRef.current.state === "suspended") ctxRef.current.resume();
        } catch (e) {}
      }, []);

      const cue = useCallback((kind) => {
        const patterns = {
          tick: { notes: [660],        len: 0.12, vibrate: 40 },
          go:   { notes: [990],        len: 0.45, vibrate: 200 },
          stop: { notes: [880, 1100],  len: 0.35, vibrate: [80, 60, 80] },
          done: { notes: [660, 880, 1100], len: 0.4, vibrate: [100, 60, 100, 60, 200] },
        };
        const p = patterns[kind];
        if (!p || mutedRef.current) return;
        try { navigator.vibrate && navigator.vibrate(p.vibrate); } catch (e) {}
        const ctx = ctxRef.current;
        if (!ctx) return;
        if (ctx.state === "suspended") ctx.resume();
        p.notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.value = freq;
          const t = ctx.currentTime + i * 0.18;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.35, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + p.len);
          osc.start(t); osc.stop(t + p.len);
        });
      }, []);

      return { unlock, cue, muted, setMuted };
    }

    // Keep the screen on while a session is running; re-acquire after the tab
    // comes back, since the browser drops the lock whenever the page is hidden.
    function useWakeLock(active) {
      useEffect(() => {
        if (!active || !("wakeLock" in navigator)) return;
        let lock = null;
        let cancelled = false;
        const acquire = async () => {
          if (document.visibilityState !== "visible") return;
          try {
            const l = await navigator.wakeLock.request("screen");
            if (cancelled) l.release(); else lock = l;
          } catch (e) {}
        };
        acquire();
        document.addEventListener("visibilitychange", acquire);
        return () => {
          cancelled = true;
          document.removeEventListener("visibilitychange", acquire);
          if (lock) lock.release();
        };
      }, [active]);
    }

    function HangboardApp() {
      const [screen, setScreen] = useState("intro");
      const [, setFrame] = useState(0);
      const rerender = useCallback(() => setFrame(f => f + 1), []);
      const { unlock, cue, muted, setMuted } = useCues();

      // All timing lives in this ref. Time is measured against a deadline on the
      // monotonic clock, so it never drifts and keeps counting correctly when
      // the browser throttles timers in a background tab.
      const engine = useRef({ stepIdx: 0, deadline: 0, remainingMs: 0, running: false, elapsedMs: 0, lastTick: 0, lastBeep: null });

      const transitionCue = useCallback((prev, next) => {
        if (next.type === "hang") cue("go");
        else if (prev.type === "hang") cue("stop");
      }, [cue]);

      const finish = useCallback(() => {
        const e = engine.current;
        e.running = false;
        e.remainingMs = 0;
        cue("done");
        setScreen("done");
      }, [cue]);

      const tick = useCallback(() => {
        const e = engine.current;
        if (!e.running) return;
        const now = performance.now();
        e.elapsedMs += now - e.lastTick;
        e.lastTick = now;

        // Catch up through every step whose deadline has passed (more than one
        // if the tab was asleep). Only cue transitions that are happening now.
        while (now >= e.deadline) {
          const late = now - e.deadline;
          if (e.stepIdx >= STEPS.length - 1) { finish(); return; }
          const prev = STEPS[e.stepIdx];
          e.stepIdx += 1;
          const next = STEPS[e.stepIdx];
          e.deadline += next.duration * 1000;
          if (late < 1000) transitionCue(prev, next);
        }
        e.remainingMs = e.deadline - now;

        const step = STEPS[e.stepIdx];
        const sec = Math.ceil(e.remainingMs / 1000);
        if (step.type !== "hang" && sec >= 1 && sec <= COUNTDOWN_BEEPS) {
          const key = `${e.stepIdx}:${sec}`;
          if (e.lastBeep !== key) { e.lastBeep = key; cue("tick"); }
        }
        rerender();
      }, [cue, finish, rerender, transitionCue]);

      useEffect(() => {
        if (screen !== "session") return;
        const id = setInterval(tick, 100);
        document.addEventListener("visibilitychange", tick);
        return () => { clearInterval(id); document.removeEventListener("visibilitychange", tick); };
      }, [screen, tick]);

      useWakeLock(screen === "session" && engine.current.running);

      // Move to a step with its full duration; keeps the current running/paused state.
      const jumpTo = useCallback((idx) => {
        const e = engine.current;
        const now = performance.now();
        const prev = STEPS[e.stepIdx];
        e.stepIdx = idx;
        e.remainingMs = STEPS[idx].duration * 1000;
        e.deadline = now + e.remainingMs;
        e.lastTick = now;
        e.lastBeep = null;
        if (e.running) transitionCue(prev, STEPS[idx]);
        rerender();
      }, [rerender, transitionCue]);

      const startSession = () => {
        unlock();
        const now = performance.now();
        engine.current = { stepIdx: 0, deadline: now + READY_SECONDS * 1000, remainingMs: READY_SECONDS * 1000, running: true, elapsedMs: 0, lastTick: now, lastBeep: null };
        setScreen("session");
      };

      const toggle = useCallback(() => {
        unlock();
        const e = engine.current;
        const now = performance.now();
        if (e.running) {
          tick();
          if (!e.running) return; // the tick just finished the session
          e.remainingMs = Math.max(0, e.deadline - now);
          e.running = false;
        } else {
          e.deadline = now + e.remainingMs;
          e.lastTick = now;
          e.running = true;
        }
        rerender();
      }, [unlock, tick, rerender]);

      const skip = useCallback(() => {
        const e = engine.current;
        if (e.stepIdx >= STEPS.length - 1) { finish(); return; }
        jumpTo(e.stepIdx + 1);
      }, [finish, jumpTo]);

      // Restart the current step, or go to the previous one if it only just started.
      const back = useCallback(() => {
        const e = engine.current;
        const spentMs = STEPS[e.stepIdx].duration * 1000 - e.remainingMs;
        jumpTo(spentMs > 2000 || e.stepIdx === 0 ? e.stepIdx : e.stepIdx - 1);
      }, [jumpTo]);

      const endSession = () => {
        if (!window.confirm("End this session?")) return;
        engine.current.running = false;
        setScreen("intro");
      };

      useEffect(() => {
        if (screen !== "session") return;
        const onKey = (ev) => {
          if (ev.code === "Space") { ev.preventDefault(); toggle(); }
          else if (ev.code === "ArrowRight") skip();
          else if (ev.code === "ArrowLeft") back();
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [screen, toggle, skip, back]);

      const e        = engine.current;
      const step     = STEPS[e.stepIdx];
      const ex       = PROTOCOL[step.exIdx];
      const isHang   = step.type === "hang";
      const color    = isHang ? PHASES[ex.phase].color : PHASES.rest.color;
      const secsLeft = Math.max(0, Math.ceil(e.remainingMs / 1000));
      const fraction = e.remainingMs / (step.duration * 1000);
      const doneSets = step.set - 1;
      const sessionProgress = (STEPS.slice(0, e.stepIdx).reduce((sum, s) => sum + s.duration, 0) + step.duration - e.remainingMs / 1000) / TOTAL_SECONDS;

      return (
        <div style={{ minHeight: "100vh", background: "#0a0a0a", color: "#f0f0f0", fontFamily: "'DM Mono', monospace", display: "flex", flexDirection: "column", alignItems: "center" }}>

          {/* Header */}
          <div style={{ width: "100%", maxWidth: 480, padding: "16px 20px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
              <span style={{ fontFamily: "'Unbounded', sans-serif", fontSize: "0.75rem", color: "#666", letterSpacing: "0.15em" }}>NOHANG</span>
              <div style={{ display: "flex", alignItems: "center", gap: 14, fontSize: "0.7rem", color: "#555" }}>
                {screen === "session" && <span>ELAPSED {formatTime(e.elapsedMs / 1000)}</span>}
                <button className="btn" onClick={() => setMuted(m => !m)} style={{ background: "none", color: "#555", padding: 0, fontSize: "0.7rem" }}>
                  {muted ? "SOUND OFF" : "SOUND ON"}
                </button>
                {screen === "session" && (
                  <button className="btn" onClick={endSession} style={{ background: "none", color: "#555", padding: 0, fontSize: "0.7rem" }}>END</button>
                )}
              </div>
            </div>
            {screen === "session" && (
              <div style={{ height: 2, background: "#1a1a1a", borderRadius: 1, marginTop: 12, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${Math.min(100, sessionProgress * 100)}%`, background: "#333", transition: "width 0.12s linear" }} />
              </div>
            )}
          </div>

          {/* ── INTRO ── */}
          {screen === "intro" && (
            <div className="fade-in" style={{ maxWidth: 480, width: "100%", padding: "32px 20px" }}>
              <div style={{ fontFamily: "'Unbounded', sans-serif", fontSize: "2rem", lineHeight: 1.1, marginBottom: 8 }}>
                No-Hang<br /><span style={{ color: "#fb923c" }}>Protocol</span>
              </div>
              <div style={{ color: "#888", fontSize: "0.78rem", marginBottom: 32, lineHeight: 1.7 }}>
                Climbing-day version, based on Emil Abrahamsson's isometric pulling method. Do it as the last part of your warm-up, then go climb — so your rest days stay rest days. ~{Math.round(TOTAL_SECONDS / 60)} min.
              </div>

              <div style={{ marginBottom: 28 }}>
                {PROTOCOL.map((ex, i) => (
                  <div key={ex.id} style={{ display: "flex", gap: 12, marginBottom: 16, alignItems: "flex-start" }}>
                    <div style={{ width: 28, height: 28, borderRadius: 4, background: PHASES[ex.phase].color + "22", border: `1px solid ${PHASES[ex.phase].color}44`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: PHASES[ex.phase].color, fontSize: "0.7rem", fontWeight: 500 }}>{i + 1}</div>
                    <div>
                      <div style={{ fontSize: "0.82rem", fontWeight: 500, color: "#e0e0e0" }}>{ex.name}</div>
                      <div style={{ fontSize: "0.7rem", color: "#666", marginTop: 2 }}>{ex.sets} sets × {ex.hangDuration}s — {ex.holdLabel} edge — rest {ex.restBetweenSets}s</div>
                    </div>
                  </div>
                ))}
              </div>

              <div style={{ background: "#111", border: "1px solid #222", borderRadius: 8, padding: "14px 16px", marginBottom: 12, fontSize: "0.72rem", color: "#888", lineHeight: 1.7 }}>
                <span style={{ color: "#fb923c" }}>HOW TO: </span>
                Feet on the floor, pull DOWN into the edge to the target effort — ramp up over ~2s, never jerk. Engage your shoulder and core throughout.
              </div>

              <div style={{ background: "#111", border: "1px solid #222", borderRadius: 8, padding: "14px 16px", marginBottom: 12, fontSize: "0.72rem", color: "#888", lineHeight: 1.7 }}>
                <span style={{ color: "#4ade80" }}>WHEN: </span>
                On climbing days only, after 5–10 min of general warm-up (pulse raiser, easy arm circles, a few jugs). 2–3× per week = every climbing day, or skip it on the day you plan to go hardest. Never on rest days.
              </div>

              <div style={{ background: "#111", border: "1px solid #222", borderRadius: 8, padding: "14px 16px", marginBottom: 28, fontSize: "0.72rem", color: "#888", lineHeight: 1.7 }}>
                <span style={{ color: "#facc15" }}>NEXT-MORNING CHECK: </span>
                Fingers feel normal → keep going. Stiff or achy → drop to 2 sets per exercise next time. Still achy → skip the working sets for a week. Only add a 4th set after 3+ weeks of normal mornings.
              </div>

              <button className="btn" onClick={startSession} style={{ width: "100%", padding: "16px", background: "#fb923c", color: "#0a0a0a", fontSize: "0.9rem", fontWeight: 600, borderRadius: 6 }}>
                START SESSION →
              </button>
            </div>
          )}

          {/* ── SESSION ── */}
          {screen === "session" && (
            <div style={{ maxWidth: 480, width: "100%", padding: "24px 20px" }}>

              {/* Phase tag */}
              <div style={{ display: "inline-block", background: color + "22", border: `1px solid ${color}55`, color, fontSize: "0.65rem", letterSpacing: "0.15em", padding: "4px 10px", borderRadius: 3, marginBottom: 20 }}>
                {isHang ? PHASES[ex.phase].label.toUpperCase() : STEP_TEXT[step.type].tag}
              </div>

              {/* Exercise name */}
              <div style={{ fontFamily: "'Unbounded', sans-serif", fontSize: "1.2rem", lineHeight: 1.2, marginBottom: 6, color: isHang ? "#f0f0f0" : "#888" }}>
                {isHang ? ex.name : STEP_TEXT[step.type].title}
              </div>

              {isHang && (
                <>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
                    <div style={{ background: color, color: "#0a0a0a", fontSize: "0.75rem", fontWeight: 700, padding: "3px 10px", borderRadius: 3, letterSpacing: "0.05em" }}>
                      {ex.holdLabel} EDGE
                    </div>
                    <div style={{ fontSize: "0.7rem", color: "#555" }}>{ex.grip} · {ex.intensity}</div>
                  </div>
                  <div style={{ background: "#111", border: "1px solid #1e1e1e", borderRadius: 6, padding: "10px 14px", marginBottom: 4, fontSize: "0.72rem", color: "#777", lineHeight: 1.7 }}>
                    <span style={{ color, fontSize: "0.65rem", letterSpacing: "0.1em" }}>GRIP · </span>{ex.gripDesc}
                  </div>
                </>
              )}

              {/* Timer ring */}
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", margin: "24px 0" }}>
                <div onClick={toggle} style={{ position: "relative", width: 160, height: 160, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
                  <Arc fraction={fraction} size={160} stroke={10} color={color} />
                  <div style={{ position: "absolute", textAlign: "center" }}>
                    <div style={{ fontFamily: "'Unbounded', sans-serif", fontSize: "2.8rem", color, lineHeight: 1, opacity: e.running ? 1 : 0.5 }}>{secsLeft}</div>
                    <div style={{ fontSize: "0.65rem", color: e.running ? "#555" : color, letterSpacing: "0.1em", marginTop: 4 }}>{e.running ? "SECONDS" : "PAUSED"}</div>
                  </div>
                </div>

                {/* Set dots */}
                <div style={{ marginTop: 16, display: "flex", gap: 6 }}>
                  {Array.from({ length: ex.sets }).map((_, i) => (
                    <div key={i} style={{ width: 20, height: 4, borderRadius: 2, background: i < doneSets ? PHASES[ex.phase].color : (isHang && i === doneSets) ? PHASES[ex.phase].color + "88" : "#222" }} />
                  ))}
                </div>
                <div style={{ fontSize: "0.68rem", color: "#555", marginTop: 8, letterSpacing: "0.1em" }}>
                  EXERCISE {step.exIdx + 1} / {PROTOCOL.length} · SET {step.set} / {ex.sets}
                </div>
              </div>

              {/* Cue (hang only) */}
              {isHang && (
                <div style={{ background: "#111", border: `1px solid ${color}22`, borderRadius: 6, padding: "12px 14px", marginBottom: 24, fontSize: "0.72rem", color: "#aaa", lineHeight: 1.6 }}>
                  {ex.note}
                </div>
              )}

              {/* Next hang preview (rest / ready / between) */}
              {!isHang && (
                <div style={{ background: "#111", border: "1px solid #1e2a1e", borderRadius: 8, padding: "14px 16px", marginBottom: 24 }}>
                  <div style={{ fontSize: "0.6rem", color: "#444", letterSpacing: "0.15em", marginBottom: 10 }}>
                    {step.type === "rest" ? "NEXT HANG" : "NEXT EXERCISE"}
                  </div>
                  <div style={{ fontSize: "0.88rem", fontWeight: 500, color: "#e0e0e0", marginBottom: 8 }}>{ex.name}</div>
                  <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
                    <div style={{ background: PHASES[ex.phase].color, color: "#0a0a0a", fontSize: "0.7rem", fontWeight: 700, padding: "2px 8px", borderRadius: 3 }}>
                      {ex.holdLabel} EDGE
                    </div>
                    <div style={{ fontSize: "0.7rem", color: "#555" }}>
                      Set {step.set} / {ex.sets} · {ex.hangDuration}s · {ex.intensity}
                    </div>
                  </div>
                  <div style={{ fontSize: "0.7rem", color: "#555", lineHeight: 1.6 }}>
                    <span style={{ color: PHASES[ex.phase].color, fontSize: "0.62rem", letterSpacing: "0.08em" }}>GRIP · </span>{ex.gripDesc}
                  </div>
                </div>
              )}

              {/* Controls */}
              <div style={{ display: "flex", gap: 10 }}>
                <button className="btn" onClick={back} style={{ flex: 1, padding: "14px", background: "#111", color: "#555", border: "1px solid #222" }}>
                  ← BACK
                </button>
                <button className="btn" onClick={toggle} style={{ flex: 2, padding: "14px", background: e.running ? "#1e1e1e" : color, color: e.running ? color : "#0a0a0a", border: `1px solid ${color}55` }}>
                  {e.running ? "⏸ PAUSE" : "▶ RESUME"}
                </button>
                <button className="btn" onClick={skip} style={{ flex: 1, padding: "14px", background: "#111", color: "#555", border: "1px solid #222" }}>
                  SKIP →
                </button>
              </div>
              <div style={{ fontSize: "0.62rem", color: "#333", textAlign: "center", marginTop: 14, lineHeight: 1.6 }}>
                Beeps count down the last {COUNTDOWN_BEEPS}s before each hang. Tap the timer to pause.
              </div>
            </div>
          )}

          {/* ── DONE ── */}
          {screen === "done" && (
            <div className="fade-in" style={{ maxWidth: 480, width: "100%", padding: "60px 20px", textAlign: "center" }}>
              <div style={{ fontSize: "3rem", marginBottom: 16 }}>🧗</div>
              <div style={{ fontFamily: "'Unbounded', sans-serif", fontSize: "1.8rem", color: "#e879f9", marginBottom: 12 }}>Session Done</div>
              <div style={{ color: "#666", fontSize: "0.78rem", marginBottom: 8 }}>Total time: {formatTime(e.elapsedMs / 1000)}</div>
              <div style={{ color: "#555", fontSize: "0.72rem", lineHeight: 1.8, margin: "16px auto 40px", maxWidth: 300 }}>
                That's your warm-up done — go climb. Do the next-morning check tomorrow and adjust next session's sets if your fingers feel off.
              </div>
              <button className="btn" onClick={() => setScreen("intro")} style={{ padding: "14px 32px", background: "#e879f9", color: "#0a0a0a", borderRadius: 6 }}>
                BACK TO START
              </button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<HangboardApp />);
  </script>
</body>
</html>
